version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: climate-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: climate-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: climate-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"

  fastapi:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: climate-fastapi
    ports:
      - "8000:8080"
    environment:
      PORT: 8080
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-climate-prediction-system}
      GCP_REGION:     ${GCP_REGION:-us-central1}
      BQ_DATASET:     ${BQ_DATASET:-kenya_onset}
      VERTEX_ENDPOINT_ID: ${VERTEX_ENDPOINT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      # Mount ADC so the container can talk to BigQuery / Firestore /
      # Vertex AI using the host's `gcloud auth application-default login`
      # credentials. The path is the Codespaces / Linux default.
      - "${HOME}/.config/gcloud:/home/apiuser/.config/gcloud:ro"
    depends_on:
      kafka:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.streamlit
    container_name: climate-streamlit
    ports:
      - "8501:8501"
    environment:
      PORT: 8501
      # Talk to the API over the docker-compose network. Override
      # API_URL when running the dashboard against a deployed Cloud
      # Run service instead of the local container.
      API_URL: ${API_URL:-http://fastapi:8080}
      API_TIMEOUT_S: ${API_TIMEOUT_S:-5}
    depends_on:
      - fastapi
